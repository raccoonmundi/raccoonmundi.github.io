<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  /* aplica o tema antes de desenhar a página: escolha guardada, senão o do sistema */
  (function () {
    var t = null;
    try { t = localStorage.getItem('mapa-tema'); } catch (e) {}
    if (t !== 'claro' && t !== 'escuro') {
      try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'; } catch (e) { t = 'claro'; }
    }
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
<title>Raccoon Mundi · Mapa geopolítico</title>
<meta name="description" content="Mapa-múndi com as notícias recentes da imprensa local de cada região, atualizado duas vezes por dia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23b23a0b%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<header class="topo">
  <div class="marca">
    <div class="sobretitulo">RACCOON MUNDI<span class="sufixo"> · <span data-i18n="mapa">MAP</span></span></div>
    <h1 data-i18n="titulo">The world through its local press</h1>
  </div>
  <div class="controles">
    <label class="ir-para" title="Region">
      <svg class="icone-busca" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5s1.2-6.1 3.8-8.5z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      <span class="sr" data-i18n="filtroRegiao">Region</span>
      <select id="filtro-regiao" aria-label="Region"></select>
    </label>
    <label class="ir-para" title="Country">
      <svg class="icone-busca" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="sr" data-i18n="filtroPais">Country</span>
      <select id="filtro-pais" aria-label="Country"></select>
    </label>
    <label class="ir-para" title="Wars and disputes">
      <svg class="icone-busca" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4.8 13.5l8.7-8.7M8 19.2L19.2 8M14 19.5l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="sr" data-i18n="filtroArea">Wars and disputes</span>
      <select id="filtro-area" aria-label="Wars and disputes"></select>
    </label>
    <div class="segmentado" role="group" aria-label="Language" id="idioma">
      <button type="button" data-l="en">EN</button>
      <button type="button" data-l="pt">PT</button>
    </div>
    <button type="button" class="botao-tema" id="tema" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
      <svg class="lua" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      <svg class="sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="barra">
  <nav class="temas" id="temas" aria-label="Themes in focus"></nav>
  <div class="segmentado" role="group" aria-label="Period" id="periodo">
    <button type="button" data-h="12">12 h</button>
    <button type="button" data-h="24">24 h</button>
    <button type="button" data-h="48">48 h</button>
  </div>
</div>

<main class="principal">
  <div class="mapa-area">
    <div id="mapa" role="region" aria-label="Map"></div>
    <div class="legenda" id="legenda" aria-hidden="true"></div>
    <button type="button" class="legenda-botao" id="legenda-botao" aria-expanded="false" aria-controls="legenda" data-i18n="legenda">Legend</button>
    <div class="modo segmentado" role="group" id="modo">
      <button type="button" data-m="regioes" data-i18n="regioes">Regions</button>
      <button type="button" data-m="paises" data-i18n="paises">Countries</button>
    </div>
    <div class="lentes" id="lentes">
      <span class="lentes-rotulo" data-i18n="corPor">Color by</span>
      <div class="segmentado" role="group" id="lentes-botoes" aria-label="Color by"></div>
      <select id="lentes-select" aria-label="Color by"></select>
    </div>
  </div>
  <aside class="painel" id="painel" aria-label="Notícias">
    <p class="sr" id="anuncio" aria-live="polite"></p>
    <button type="button" class="alca" id="alca" aria-label="Expand panel"></button>
    <div id="painel-conteudo"></div>
    <footer class="rodape" id="rodape"></footer>
  </aside>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js?v=dev"></script>
</body>
</html>
