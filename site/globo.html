<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  /* aplica o tema antes de desenhar a página: escolha guardada, senão o do sistema */
  (function () {
    var t = null;
    try { t = localStorage.getItem('mapa-tema'); } catch (e) {}
    if (t !== 'claro' && t !== 'escuro') {
      try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'; } catch (e) { t = 'claro'; }
    }
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
<title>Raccoon Mundi · Globo geopolítico (protótipo)</title>
<meta name="description" content="Mapa-múndi com as notícias recentes da imprensa local de cada região, atualizado duas vezes por dia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23b23a0b%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<style>
  /* protótipo em globo: o espaço em volta do planeta e os detalhes do MapLibre */
  :root { --espaco: #e8edf0; }
  :root[data-tema="escuro"] { --espaco: #05090c; }
  #mapa { background: radial-gradient(circle at 50% 45%, var(--espaco) 0%, var(--creme) 120%); }
  :root[data-tema="escuro"] #mapa { background: radial-gradient(circle at 50% 45%, #0e1620 0%, var(--espaco) 75%); }
  .maplibregl-ctrl-top-left .maplibregl-ctrl { margin: 12px 0 0 12px; }
  .maplibregl-ctrl-group { background: var(--superficie); box-shadow: 0 2px 8px var(--sombra); border: 1px solid var(--borda); }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--linha); }
  :root[data-tema="escuro"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
  .dica-mapa {
    position: absolute; z-index: 600; pointer-events: none; transform: translate(-50%, -100%); display: none;
    background: var(--tinta); color: var(--sobre-tinta); border-radius: 6px; font-size: 12px; font-weight: 600;
    padding: 4px 8px; white-space: nowrap; max-width: 320px;
  }
  .dica-mapa .dica { font-weight: 400; opacity: .75; }
  .selo-prototipo { font-size: 10px; letter-spacing: .08em; border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
  @media (max-width: 820px) { .maplibregl-ctrl-top-left { display: none; } .selo-prototipo { display: none; } }
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <div class="sobretitulo">RACCOON MUNDI · <span data-i18n="mapa">MAP</span><span class="selo-prototipo">GLOBO</span></div>
    <h1 data-i18n="titulo">The world through its local press</h1>
  </div>
  <div class="controles">
    <label class="ir-para">
      <svg class="icone-busca" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr" data-i18n="irPara">Go to</span>
      <select id="ir-para" aria-label="Go to"></select>
    </label>
    <div class="segmentado" role="group" aria-label="Language" id="idioma">
      <button type="button" data-l="en">EN</button>
      <button type="button" data-l="pt">PT</button>
    </div>
    <button type="button" class="botao-tema" id="tema" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
      <svg class="lua" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      <svg class="sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="barra">
  <nav class="temas" id="temas" aria-label="Themes in focus"></nav>
  <div class="segmentado" role="group" aria-label="Period" id="periodo">
    <button type="button" data-h="12">12 h</button>
    <button type="button" data-h="24">24 h</button>
    <button type="button" data-h="48">48 h</button>
  </div>
</div>

<main class="principal">
  <div class="mapa-area">
    <div id="mapa" role="region" aria-label="Map"></div>
    <div class="legenda" id="legenda" aria-hidden="true"></div>
    <button type="button" class="legenda-botao" id="legenda-botao" aria-expanded="false" aria-controls="legenda" data-i18n="legenda">Legend</button>
    <div class="modo segmentado" role="group" id="modo">
      <button type="button" data-m="regioes" data-i18n="regioes">Regions</button>
      <button type="button" data-m="paises" data-i18n="paises">Countries</button>
    </div>
  </div>
  <aside class="painel" id="painel" aria-label="Notícias">
    <p class="sr" id="anuncio" aria-live="polite"></p>
    <button type="button" class="alca" id="alca" aria-label="Expand panel"></button>
    <div id="painel-conteudo"></div>
    <footer class="rodape" id="rodape"></footer>
  </aside>
</main>

<script type="module">
  /* MapLibre vem como módulo; o restante da página continua como script comum */
  import * as maplibregl from './vendor/maplibre/maplibre-gl.mjs';
  window.maplibregl = maplibregl;
  var s = document.createElement('script'); s.src = 'globo.js'; document.body.appendChild(s);
</script>
</body>
</html>
