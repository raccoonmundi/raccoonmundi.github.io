name: Diagnóstico GDELT
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ferramentas/testar_gdelt.py"
      - ".github/workflows/diagnostico-gdelt.yml"
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python ferramentas/testar_gdelt.py
