name: Diagnóstico ISW
on:
  push:
    branches: [main]
    paths: ["ferramentas/diag_isw.py", ".github/workflows/diag-isw.yml"]
permissions:
  contents: read
jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests && python ferramentas/diag_isw.py
