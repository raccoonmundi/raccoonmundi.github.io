name: Atualizar mapa

on:
  # Rodar à mão: aba Actions > Atualizar mapa > Run workflow (dá para informar países, ex.: US,BR)
  workflow_dispatch:
    inputs:
      paises:
        description: "Códigos ISO separados por vírgula (vazio = padrão do robo/config.json)"
        required: false
        default: ""
      revezamento:
        description: "Uso interno do robô: deixe vazio"
        required: false
        default: ""
  # Qualquer mudança no site, no robô ou nos temas (a rodada do Raccoon Mundi grava site/data/temas.json)
  push:
    branches: [main]
    paths:
      - "site/**"
      - "robo/**"
      - ".github/workflows/atualizar.yml"
  # Quase em tempo real: quem mantém o ritmo de 15 em 15 min é o revezamento (job "revezar", robo/revezar.py):
  # cada rodada espera o próximo :02/:17/:32/:47 (2 min depois de o GDELT publicar o arquivo novo) e dispara a seguinte.
  # O agendador do GitHub não disparou nenhuma vez neste repositório (26/11/2026), então ele fica só de reserva:
  # se o revezamento parar, a rodada agendada (quando o GitHub rodar) o religa.
  schedule:
    - cron: "52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write  # o revezamento dispara a próxima rodada

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Uma coleta por vez (a espera do revezamento fica fora disso, para não segurar as rodadas de push)
    concurrency:
      group: atualizar-mapa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # parte sempre dos dados mais recentes, mesmo numa execução que ficou na fila

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt

      - name: Restaurar modelos de tradução
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/stanza_resources
            ~/.cache/mapa-raccoon-mundi
          key: argos-${{ runner.os }}-inicio
          restore-keys: argos-${{ runner.os }}-

      # Entre as rodadas, o histórico do robô fica no cache (o repositório só recebe os dados 1x por dia)
      - name: Restaurar o estado da última coleta
        uses: actions/cache/restore@v4
        with:
          path: .estado-robo
          key: estado-robo-${{ github.run_id }}
          restore-keys: estado-robo-

      - name: Usar o estado mais recente (cache ou repositório)
        run: python robo/estado.py restaurar

      - name: Instalar dependências
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r robo/requirements.txt

      - name: Atualizar áreas em guerra (DeepStateMap)
        run: python robo/zonas_guerra.py

      - name: Coletar notícias
        env:
          PAISES: ${{ github.event.inputs.paises }}
          ARGOS_DEVICE_TYPE: cpu
        run: |
          if [ -n "$PAISES" ]; then python robo/coletar.py --paises "$PAISES"; else python robo/coletar.py; fi
          ls ~/.local/share/argos-translate/packages 2>/dev/null > .argos-list || true

      - name: Guardar modelos de tradução novos
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/stanza_resources
            ~/.cache/mapa-raccoon-mundi
          key: argos-${{ runner.os }}-${{ hashFiles('.argos-list') }}

      - name: Guardar o estado desta coleta
        run: python robo/estado.py guardar

      - name: Salvar o estado no cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .estado-robo
          key: estado-robo-${{ github.run_id }}

      - name: Gravar dados no repositório (rodada de push ou manual, e 1x por dia nas automáticas)
        env:
          GATILHO: ${{ github.event_name }}
          REVEZAMENTO: ${{ github.event.inputs.revezamento }}
        run: |
          horas=$(git show HEAD:site/data/noticias.json | python -c "import json,sys,datetime as d; g=json.load(sys.stdin)['gerado_em']; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g.replace('Z','+00:00'))).total_seconds()//3600))" || echo 99)
          if [ "$GATILHO" = "push" ] || { [ "$GATILHO" = "workflow_dispatch" ] && [ "$REVEZAMENTO" != "sim" ]; } || [ "$horas" -ge 23 ]; then
            echo "Gravando (gatilho: $GATILHO; último registro no repositório há ${horas} h)."
          else
            echo "Rodada automática: os dados ficam só no cache e no site (último registro no repositório há ${horas} h)."
            exit 0
          fi
          git config user.name "robo-raccoon-mundi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/noticias.json site/geo/zonas_guerra.geojson 2>/dev/null || git add site/data/noticias.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Dados: coleta de $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main  # em conflito, vale a coleta desta execução
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      # Carimba a versão nos links do CSS e do JS (style.css?v=..., app.js?v=..., globo.js?v=...):
      # assim o navegador busca o código novo a cada publicação, em vez de usar a cópia guardada.
      - name: Marcar a versão dos arquivos do site
        run: |
          v="$(git rev-parse --short HEAD)-$(date -u +%H%M)"
          sed -i "s/?v=dev/?v=$v/g" site/index.html site/globo.html
          grep -o '?v=[^"'"'"']*' site/index.html site/globo.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-site
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Passa o bastão: espera o próximo horário de coleta e dispara a rodada seguinte.
  # Roda mesmo se a coleta falhar (o robô tenta de novo daqui a 15 min); rodada cancelada à mão não passa o bastão.
  revezar:
    needs: publicar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: robo/revezar.py
          sparse-checkout-cone-mode: false
      - name: Esperar o próximo arquivo do GDELT e disparar a próxima rodada
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 robo/revezar.py
